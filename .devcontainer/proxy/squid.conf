http_port 3128

# ═══════════════════════════════════════════════════════════════════════════
# PID ファイルを書かない。**これを外すと devcontainer が開かなくなる。**
pid_filename none

# graceful shutdown を Docker の stop timeout 内に収める
shutdown_lifetime 5 seconds

acl hc_canary dstdomain canary.invalid
access_log stdio:/var/log/squid/access.log squid !hc_canary

error_directory /usr/share/squid/errors/templates

acl CONNECT method CONNECT
acl SSL_ports port 443

acl allowed_domains dstdomain "/etc/squid/allowlist.txt"
acl allowed_domains_local dstdomain "/etc/squid/allowlist.local.txt"

# Claudex (CLIProxyAPI) 用
acl cliproxy_host dstdomain host.docker.internal
acl cliproxy_port port 18317

# to_linklocal は Squid 5.5 では **組み込みではない**ので自分で定義する
acl to_linklocal dst 169.254.0.0/16 fe80::/10

http_access deny to_localhost
http_access deny to_linklocal

# consumer 固有の許可先
http_access allow CONNECT allowed_domains_local SSL_ports

# Claudex: plain HTTP なので CONNECT 系の行はどれも一致しない
# `deny all` の**前**に置く
http_access allow cliproxy_host cliproxy_port

deny_info ERR_DEVCONTAINER_EGRESS all
http_access deny all
