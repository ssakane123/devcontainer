services:
  proxy:
    build:
      context: ../proxy
      dockerfile: Dockerfile
    networks: [internal, egress]
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -s -o /tmp/c -w '%{http_code}' -x 127.0.0.1:3128 --max-time 5 http://canary.invalid/ | grep -q 403 && grep -q X-DEVCONTAINER-EGRESS-DENIED /tmp/c"
      interval: 10s
      timeout: 8s
      retries: 3
      start_period: 5s
    volumes:
      - type: bind
        source: ../templates/allowlist.local.txt
        target: /etc/squid/allowlist.local.txt
        read_only: true

  dev:
    build:
      context: ../python
      dockerfile: Dockerfile
      additional_contexts:
        common: ../common
    command: ["sleep", "infinity"]
    networks: [internal]
    depends_on:
      proxy:
        condition: service_healthy
    volumes:
      - type: bind
        source: ../..
        target: /workspaces/devcontainer
      - type: volume
        source: claude-code-config
        target: /home/vscode/.claude
      - type: volume
        source: claude-code-npm-cache
        target: /home/vscode/.npm
      - type: bind
        source: "${HOME:?HOME is unset}/.claude/CLAUDE.md"
        target: /home/vscode/.claude/CLAUDE.md
      - type: bind
        source: "${HOME:?HOME is unset}/.claude/.mcp.json"
        target: /workspaces/devcontainer/.mcp.json
        read_only: true
      - type: bind
        source: "${HOME:?HOME is unset}/.claude/commands"
        target: /home/vscode/.claude/commands
        read_only: true
      - type: bind
        source: "${HOME:?HOME is unset}/.config/git/ignore"
        target: /home/vscode/.config/git/ignore
        read_only: true
      - type: bind
        source: "${HOME:?HOME is unset}/.claude/cliproxyapi/cliproxy-client-key"
        target: /home/vscode/.claude/cliproxy-client-key
        read_only: true
    environment:
      HTTP_PROXY: "http://proxy:3128"
      HTTPS_PROXY: "http://proxy:3128"
      http_proxy: "http://proxy:3128"
      https_proxy: "http://proxy:3128"
      NO_PROXY: "localhost,127.0.0.1,::1,proxy"
      no_proxy: "localhost,127.0.0.1,::1,proxy"
      NODE_USE_ENV_PROXY: "1"
volumes:
  claude-code-config:
    name: claude-code-config
  claude-code-npm-cache:
    name: claude-code-npm-cache

networks:
  internal:
    internal: true
  egress: {}
