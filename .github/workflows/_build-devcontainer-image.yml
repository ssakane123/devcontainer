# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
# devcontainer イメージ 1 言語分の build (& push) を行う再利用ワークフロー。
# devcontainer-images.yml から呼び出される。
#
# イメージ名: ghcr.io/<owner>/devcontainer-<lang>:<IMAGE_VERSION の内容>
name: _build-devcontainer-image

on:
  workflow_call:
    inputs:
      lang:
        description: "言語名 = .devcontainer/<lang>/ のディレクトリ名 (例: python)"
        type: string
        required: true
      push:
        description: "true なら GHCR に push、false なら build のみ"
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  build:
    name: build devcontainer-${{ inputs.lang }}
    # ベースイメージ (ghcr.io/<owner>/<lang>) が arm64 のため
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@v7

      # https://github.com/docker/setup-buildx-action
      - uses: docker/setup-buildx-action@v4

      # push 用、およびベースイメージ (ghcr.io/<owner>/<lang>) の pull 用
      # https://github.com/docker/login-action
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR のイメージ名は小文字のみ
      - id: registry
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # .devcontainer/IMAGE_VERSION からイメージタグを取り出す (整数のみ許可)
      - id: version
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < .devcontainer/IMAGE_VERSION)
          if ! [[ "$version" =~ ^[0-9]+$ ]]; then
            echo "::error::.devcontainer/IMAGE_VERSION は整数で記載してください (現在: '${version}')"
            exit 1
          fi
          echo "value=${version}" >> "$GITHUB_OUTPUT"

      # https://github.com/docker/metadata-action
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.registry.outputs.name }}/devcontainer-${{ inputs.lang }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=sha,prefix=sha-

      # https://github.com/docker/build-push-action
      - uses: docker/build-push-action@v7
        with:
          context: .devcontainer/${{ inputs.lang }}
          # Dockerfile 内の `COPY --from=common` 用 (devcontainer.json の build.options 相当)
          build-contexts: |
            common=.devcontainer/common
          platforms: linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=devcontainer-${{ inputs.lang }}
          cache-to: type=gha,mode=max,scope=devcontainer-${{ inputs.lang }}
